; AnnTodo configuration file.
; Every key can be overridden with an environment variable named
; ANNTODO_<SECTION>_<KEY>, for example ANNTODO_SERVER_PORT=8080.
; Relative paths are resolved against the directory that contains "conf".

[server]
; Listen address and port
host = 0.0.0.0
port = 8080
; Serve HTTPS directly (optional). Leave empty to serve plain HTTP and
; terminate TLS in a reverse proxy such as Nginx, Caddy or IIS.
cert_file =
key_file =
; Comma separated list of reverse proxy addresses whose X-Forwarded-For header is trusted
trusted_proxies = 127.0.0.1,::1

[database]
; sqlite | mysql | postgres
type = sqlite
; SQLite database file (default: <data_dir>/anntodo.db)
path =
; MySQL / PostgreSQL connection settings
host = 127.0.0.1
port =
name = anntodo
user =
password =
; PostgreSQL only: disable | require | verify-full
ssl_mode = disable

[storage]
; Data directory (SQLite database, avatars)
data_dir = data

[log]
; debug | info | warn | error
level = info
; Log file path. Leave empty to log to the console only.
file =

[session]
; Lifetime of "remember me" logins, in days
remember_days = 30
; Sliding lifetime of normal logins, in hours
default_hours = 24
